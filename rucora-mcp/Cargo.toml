[package]
name = "rucora-mcp"
version.workspace = true
edition = "2024"
description = "MCP (Model Context Protocol) integration for rucora"
documentation = "https://docs.rs/rucora-mcp"
readme = "README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rucora-core.workspace = true
rmcp = { version = "3.0", features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "transport-child-process"] }
async-trait = "0.1"
futures-util = { workspace = true }
tokio = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"

[lints]
workspace = true
