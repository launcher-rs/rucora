[package]
name = "rucora-tools"
version.workspace = true
edition = "2024"
description = "Built-in tools for rucora (shell, file, HTTP, git, web search, etc.)"
documentation = "https://docs.rs/rucora-tools"
readme = "README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rucora-core.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "process", "fs"] }
tracing = "0.1"
thiserror = "2"
reqwest = { workspace = true }
regex = "1"
chrono = "0.4"
url = "2"
scraper = "0.27"
html2text = "0.17"
dom_smoothie = "0.18"
schemars = "1.2"
backon = "1.6"
glob = "0.3"

# 继承 workspace 级别的 lint 配置
[lints]
workspace = true
