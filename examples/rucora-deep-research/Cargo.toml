[package]
name = "rucora-deep-research"
version.workspace = true
edition = "2024"
description = "rucora 深度研究示例 - 自动调用工具完成研究并生成报告"
publish = false

[dependencies]
rucora = { workspace = true, features = ["full"] }
rucora-core.workspace = true
rucora-providers.workspace = true
rucora-tools.workspace = true
rucora-skills.workspace = true
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
async-trait = "0.1"
chrono = "0.4"
dotenv = "0.15"

# 配置管理
toml = "1"
dirs = "7"
dialoguer = "0.12"
console = "0.16"

[lints]
workspace = true
