[package]
name = "rucora-retrieval"
version.workspace = true
edition = "2024"
description = "Vector store retrieval for rucora (in-memory, Chroma, Qdrant)"
documentation = "https://docs.rs/rucora-retrieval"
readme = "README.md"
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["in-memory"]
in-memory = []
chroma = []
all = ["in-memory", "chroma"]

[dependencies]
rucora-core.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
reqwest = { workspace = true }
tracing = "0.1"
thiserror = "2"
dashmap = "5"

[lints]
workspace = true
